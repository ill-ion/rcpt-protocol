[package]
name = "rcpt-anchor"
version = "0.1.0"
description = "RCPT Protocol — Solana anchor program for Merkle root anchoring"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "rcpt_anchor"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
