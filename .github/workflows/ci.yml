name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-sdk:
    name: Python SDK
    # Pinned: ubuntu-latest is Ubuntu 26.04, which has no Python 3.9 build.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install cryptography
      - name: Run tests
        working-directory: sdk/python
        run: python -m unittest discover -s tests -v

  typescript-sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        working-directory: sdk/typescript
        run: npm install
      - name: Build
        working-directory: sdk/typescript
        run: npx tsc
      - name: Run tests
        working-directory: sdk/typescript
        run: node --test tests/test_rcpt.mjs

  cross-sdk-interop:
    # The interop suite skips itself when the TS SDK isn't built, so it needs
    # its own job that builds TS first. Fails if the tests were skipped.
    name: Python ↔ TypeScript interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: pip install cryptography
      - name: Build TypeScript SDK
        working-directory: sdk/typescript
        run: npm install && npx tsc
      - name: Run interop tests
        working-directory: sdk/python
        shell: bash  # explicit shell enables pipefail, so a test failure isn't masked by tee
        run: |
          python -m unittest tests.test_interop -v 2>&1 | tee interop.log
          if grep -q "skipped" interop.log; then echo "Interop tests were skipped"; exit 1; fi

  mcp-server:
    name: MCP Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install cryptography
      - name: Run tests
        working-directory: integrations/mcp
        run: python -m unittest test_mcp -v

  reputation-and-compliance:
    name: Reputation & Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install cryptography
      - name: Run reputation tests
        working-directory: sdk/python
        run: python -m unittest tests.test_reputation -v
      - name: Run compliance tests
        working-directory: sdk/python
        run: python -m unittest tests.test_compliance -v
