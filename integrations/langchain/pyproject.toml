[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rcpt-langchain"
version = "0.1.0"
description = "RCPT Protocol integration for LangChain — automatic receipt generation for AI agent workflows."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "RCPT Protocol Contributors"},
]
keywords = ["rcpt", "langchain", "ai", "agents", "attestation", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "rcpt>=0.1.0",
    "langchain-core>=0.1.0",
]

[project.urls]
Homepage = "https://rcptprotocol.com"
Repository = "https://github.com/rcpt-protocol/rcpt-protocol"
